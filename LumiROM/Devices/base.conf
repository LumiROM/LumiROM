# Base firmware every supported device is built from.
#
# Read by scripts/firmware/fw_get_base_device (build_local.sh) and by
# scripts/tui/state.py, so both resolve the base from the same place.
#
# A device is supported when LumiROM/Devices/<model>/config exists.

BASE_DEVICE=SM-A346B

# Example IMEI of that base device. samloader only needs a valid one to query
# the firmware; the TUI uses it to prefill the field.
BASE_IMEI=353117555323497
