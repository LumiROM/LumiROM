name: Firmware mirror

# Keeps the public FW bucket (Hugging Face) holding Samsung's latest base
# firmware, already unpacked into partition images. The build workflows pull
# from it instead of downloading ~8.3 GB from Samsung in every leg (~15 min
# each). If the bucket is empty or stale, the build falls back to Samsung.
#
# Runs weekly; it is a no-op (about a minute) unless Samsung published a new
# base firmware.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Free disk space (1/3)
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a

    - name: Free disk space (2/3)
      uses: jlumbroso/free-disk-space@main

    - name: Free disk space (3/3)
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install required packages
      run: |
        source scripts/utils/install_packages.sh
        INSTALL_PACKAGES

    - name: Mirror the latest base firmware
      env:
        HF_USER: ${{ vars.HF_USER }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        BASE_MODEL: SM-A346B
        BASE_CSC: EUX
        BASE_IMEI: "353117555323497"
      run: bash scripts/firmware/fw_bucket.sh mirror
