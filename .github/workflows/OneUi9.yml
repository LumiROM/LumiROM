name: LumiROM Tools

on:
  workflow_dispatch:
    inputs:
      STOCK_DEVICE:
        description: "Put the Model of your phone, remember it starts with SM-"
        required: true
        default: "SM-"
      TARGET_DEVICE:
        description: "Put the Model of the target, remember it starts with SM-"
        required: true
        default: "SM-"
      TARGET_CSC:
        description: "Put the CSC of the target, remember it is 3 letters"
        required: true
      TARGET_IMEI:
        description: "Put the IMEI of the target, remember it is 15 digits"
        required: true
        default: ""
      DESTINATION:
        description: 'Where to upload the ROM, choose between Hugging Face (if have account) or GoFile'
        required: true
        default: "gofile"
        type: choice
        options:
          - huggingface
          - gofile
      USE_MODS:
        required: false
        default: true
        type: boolean
      USE_GALAXY_AI:
        description: "Include Galaxy AI (disabled by default)"
        required: false
        default: false
        type: boolean
      USE_UI_8_TETHERING_APEX:
        description: "Activate if the BPF version on kernel is lower than 5.10"
        required: false
        default: false
        type: boolean
      ZIP_IMG:
        description: "Deliver the partition images (.img) in a ZIP instead of a flashable ROM"
        required: false
        default: false
        type: boolean
      TARGET_FILES:
        description: "Save and upload target files (TARGET_FILES zip) for future incremental OTAs"
        required: false
        default: false
        type: boolean
      OTA_CHANGELOG:
        description: "Changelog for the OTA manifest (use ; to separate lines)"
        required: false
        default: ""
        type: string
      INCREMENTAL_FROM:
        description: "Previous version to build an incremental OTA from (e.g. 8.6.4). Leave empty for full OTA only"
        required: false
        default: ""
        type: string
      TEST_BUILD:
        description: "Test build: skip incremental/target-files/OTA manifests and release"
        required: false
        default: false
        type: boolean

# User entry point (forks): one device, base firmware chosen by the user.
jobs:
  pipeline:
    uses: ./.github/workflows/build-rom.yml
    secrets: inherit
    with:
      devices: ${{ format('["{0}"]', github.event.inputs.STOCK_DEVICE) }}
      target_device: ${{ github.event.inputs.TARGET_DEVICE }}
      target_csc: ${{ github.event.inputs.TARGET_CSC }}
      target_imei: ${{ github.event.inputs.TARGET_IMEI }}
      destination: ${{ inputs.DESTINATION }}
      use_mods: ${{ inputs.USE_MODS }}
      use_galaxy_ai: ${{ inputs.USE_GALAXY_AI }}
      use_ui_8_tethering_apex: ${{ inputs.USE_UI_8_TETHERING_APEX }}
      zip_img: ${{ inputs.ZIP_IMG }}
      target_files: ${{ inputs.TARGET_FILES }}
      ota_changelog: ${{ inputs.OTA_CHANGELOG }}
      incremental_from: ${{ inputs.INCREMENTAL_FROM }}
      test_build: ${{ inputs.TEST_BUILD }}
