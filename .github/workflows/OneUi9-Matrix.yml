name: LumiROM Tools for all devices

on:
  workflow_dispatch:
    inputs:
      DESTINATION:
        description: 'Where to upload the ROM, choose between Hugging Face (if have account) or GoFile'
        required: true
        default: "huggingface"
        type: choice
        options:
          - huggingface
          - gofile
      USE_MODS:
        required: false
        default: true
        type: boolean
      USE_GALAXY_AI:
        description: "Include Galaxy AI (disabled by default)"
        required: false
        default: false
        type: boolean
      USE_UI_8_TETHERING_APEX:
        description: "Activate if the BPF version on kernel is lower than 5.10"
        required: false
        default: false
        type: boolean
      ZIP_IMG:
        description: "Deliver the partition images (.img) in a ZIP instead of a flashable ROM"
        required: false
        default: false
        type: boolean
      TARGET_FILES:
        description: "Save and upload target files (TARGET_FILES zip) for future incremental OTAs"
        required: false
        default: false
        type: boolean
      OTA_CHANGELOG:
        description: "Changelog for the OTA manifest (use ; to separate lines)"
        required: false
        default: ""
        type: string
      INCREMENTAL_FROM:
        description: "Previous version to build an incremental OTA from (e.g. 8.6.4). Leave empty for full OTA only"
        required: false
        default: ""
        type: string

# Every build step lives in scripts/ci/*.sh, so this workflow (all devices) and
# OneUi9.yml (single device) run exactly the same code.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [SM-A325F, SM-A325M, SM-M325F, SM-A225F, SM-E225F]

    outputs:
      can_ota: ${{ steps.ota-cap.outputs.can_ota }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Free disk space (1/3)
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a

    - name: Free disk space (2/3)
      uses: jlumbroso/free-disk-space@main

    - name: Free disk space (3/3)
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install required packages
      run: |
        source scripts/utils/install_packages.sh
        INSTALL_PACKAGES

    - name: Install Android build-tools
      run: bash scripts/ci/toolchain.sh

    - name: Setup directories
      run: bash scripts/ci/workspace.sh

    - name: Set build environment
      env:
        LUMIROM_VERSION: ${{ vars.LUMIROM_VERSION }}
        STOCK_DEVICE: ${{ matrix.device }}
        TARGET_DEVICE: SM-A346B
        TARGET_CSC: EUX
        TARGET_IMEI: "353117555323497"
        USE_MODS: ${{ github.event.inputs.USE_MODS }}
        USE_GALAXY_AI: ${{ github.event.inputs.USE_GALAXY_AI }}
        USE_UI_8_TETHERING_APEX: ${{ github.event.inputs.USE_UI_8_TETHERING_APEX }}
        ZIP_IMG: ${{ github.event.inputs.ZIP_IMG }}
        DESTINATION: ${{ github.event.inputs.DESTINATION }}
        LUMIROM_MAINTAINER: ${{ github.actor }}
      run: bash scripts/ci/env.sh

    - name: Detect official OTA capabilities
      id: ota-cap
      env:
        OTA_PK8: ${{ secrets.OTA_PK8 }}
        OTA_CERT: ${{ secrets.OTA_CERT }}
        UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
      run: bash scripts/ci/ota_capability.sh

    - name: Check repo
      env:
        PLATFORM_CERT: ${{ secrets.PLATFORM_CERT }}
      run: |
        source scripts/features/LumiROM.sh
        IS_OFFICIAL

    - name: Fetch base firmware
      env:
        HF_USER: ${{ vars.HF_USER }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: bash scripts/ci/firmware.sh base

    - name: Download vendor for ${{ matrix.device }}
      run: bash scripts/ci/firmware.sh vendor

    - name: Preparing partitions
      run: bash scripts/ci/firmware.sh partitions

    - name: Apply vendor patches
      run: bash scripts/ci/features.sh vendor-patches

    - name: Apply stock config
      run: bash scripts/ci/features.sh stock-config

    - name: Debloat ROM
      run: bash scripts/ci/features.sh debloat

    - name: Apply prop features
      run: bash scripts/ci/features.sh props

    - name: Adding mods
      run: bash scripts/ci/features.sh mods

    - name: Patching hotspot
      env:
        PLATFORM_PK8: ${{ secrets.PLATFORM_PK8 }}
        PLATFORM_CERT: ${{ secrets.PLATFORM_CERT }}
      run: bash scripts/ci/features.sh hotspot

    - name: Adding LumiFota OTA Updater
      env:
        BUILD_STATUS: ${{ env.BUILD_STATUS }}
        PLATFORM_PK8: ${{ secrets.PLATFORM_PK8 }}
        PLATFORM_CERT: ${{ secrets.PLATFORM_CERT }}
      run: bash scripts/ci/features.sh lumifota

    - name: Configuring Galaxy AI
      run: bash scripts/ci/features.sh ai

    - name: Update Build ID
      run: bash scripts/ci/features.sh display-id

    - name: Install stock framework-res
      run: bash scripts/ci/features.sh framework-res

    - name: Decompile framework jars
      run: bash scripts/ci/framework.sh decompile

    - name: Patch Knox
      env:
        BUILD_STATUS: ${{ env.BUILD_STATUS }}
        PLATFORM_CERT: ${{ secrets.PLATFORM_CERT }}
      run: bash scripts/ci/features.sh knox

    - name: Recompile framework
      env:
        PLATFORM_PK8: ${{ secrets.PLATFORM_PK8 }}
        PLATFORM_CERT: ${{ secrets.PLATFORM_CERT }}
      run: bash scripts/ci/framework.sh recompile

    - name: Build ROM
      env:
        OTA_PK8: ${{ secrets.OTA_PK8 }}
        OTA_CERT: ${{ secrets.OTA_CERT }}
      run: bash scripts/ci/rom.sh build

    - name: Update updater-script
      if: ${{ github.event.inputs.ZIP_IMG != 'true' }}
      run: bash scripts/ci/rom.sh updater-script

    - name: Inject SamsungCamera cleanup (full OTA)
      if: ${{ github.event.inputs.ZIP_IMG != 'true' }}
      run: bash scripts/ci/rom.sh inject-camera-cleanup

    - name: Prepare flashable zip
      if: ${{ github.event.inputs.ZIP_IMG != 'true' }}
      run: bash scripts/ci/rom.sh flashable-zip

    - name: Sign OTA package
      if: ${{ github.event.inputs.ZIP_IMG != 'true' }}
      env:
        OTA_PK8: ${{ secrets.OTA_PK8 }}
        OTA_CERT: ${{ secrets.OTA_CERT }}
      run: bash scripts/ci/rom.sh sign

    - name: Prepare IMG zip
      if: ${{ github.event.inputs.ZIP_IMG == 'true' }}
      run: bash scripts/ci/rom.sh img-zip

    - name: Save target files
      if: ${{ github.event.inputs.ZIP_IMG != 'true' && github.event.inputs.TARGET_FILES == 'true' && steps.ota-cap.outputs.can_ota == 'true' }}
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_USER: ${{ vars.HF_USER }}
      run: bash scripts/ci/rom.sh target-files

    - name: Download previous target files
      if: ${{ github.event.inputs.INCREMENTAL_FROM != '' && steps.ota-cap.outputs.can_ota == 'true' }}
      env:
        HF_USER: ${{ vars.HF_USER }}
        INCREMENTAL_FROM: ${{ github.event.inputs.INCREMENTAL_FROM }}
      run: bash scripts/ci/incremental.sh fetch-source

    - name: Build incremental OTA
      if: ${{ github.event.inputs.INCREMENTAL_FROM != '' && env.INCREMENTAL_SOURCE_AVAILABLE != 'false' && steps.ota-cap.outputs.can_ota == 'true' }}
      run: bash scripts/ci/incremental.sh build

    - name: Inject SamsungCamera cleanup (incremental OTA)
      if: ${{ github.event.inputs.INCREMENTAL_FROM != '' && env.INCREMENTAL_SOURCE_AVAILABLE != 'false' && steps.ota-cap.outputs.can_ota == 'true' }}
      run: bash scripts/ci/incremental.sh inject-cleanup

    - name: Sign incremental OTA
      if: ${{ github.event.inputs.INCREMENTAL_FROM != '' && env.INCREMENTAL_SOURCE_AVAILABLE != 'false' && steps.ota-cap.outputs.can_ota == 'true' }}
      env:
        OTA_PK8: ${{ secrets.OTA_PK8 }}
        OTA_CERT: ${{ secrets.OTA_CERT }}
      run: bash scripts/ci/incremental.sh sign

    - name: Upload ROM to ${{ github.event.inputs.DESTINATION }}
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_USER: ${{ vars.HF_USER }}
        HF_XET_HIGH_PERFORMANCE: "1"
      run: bash scripts/package/upload.sh "$DESTINATION"

    - name: Generate OTA manifests
      if: ${{ github.event.inputs.ZIP_IMG != 'true' && steps.ota-cap.outputs.can_ota == 'true' }}
      env:
        OTA_CHANGELOG: ${{ github.event.inputs.OTA_CHANGELOG }}
      run: bash scripts/ci/manifests.sh generate

    - name: Upload OTA manifests
      if: ${{ github.event.inputs.ZIP_IMG != 'true' && steps.ota-cap.outputs.can_ota == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ota-manifests-${{ matrix.device }}
        path: OTA_MANIFESTS/
        retention-days: 1

    - name: Cleanup
      run: sudo rm -rf *

  release:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.inputs.ZIP_IMG != 'true' && needs.build.outputs.can_ota == 'true' }}

    steps:
    - name: Download OTA manifests
      uses: actions/download-artifact@v8
      with:
        pattern: ota-manifests-*
        path: OTA_MANIFESTS/
        merge-multiple: true

    - name: Update OTA manifests in LumiROM/updater
      env:
        UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
      run: bash scripts/ci/manifests.sh publish
