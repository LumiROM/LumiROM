name: Build ROM

# Reusable pipeline: both entry points (one device or all of them) call this,
# so the 40 steps are defined once. Every step is a script under scripts/ci/.

on:
  workflow_call:
    inputs:
      devices:
        description: JSON array of device models to build
        required: true
        type: string
      target_device:
        description: Base firmware model
        required: true
        type: string
      target_csc:
        description: Base firmware CSC
        required: true
        type: string
      target_imei:
        description: Base firmware IMEI (samloader)
        required: true
        type: string
      destination:
        description: huggingface or gofile
        required: true
        type: string
      use_mods:
        required: false
        type: boolean
        default: true
      use_galaxy_ai:
        required: false
        type: boolean
        default: false
      use_ui_8_tethering_apex:
        required: false
        type: boolean
        default: false
      zip_img:
        required: false
        type: boolean
        default: false
      target_files:
        required: false
        type: boolean
        default: false
      ota_changelog:
        required: false
        type: string
        default: ""
      incremental_from:
        required: false
        type: string
        default: ""
      test_build:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(inputs.devices) }}

    outputs:
      can_ota: ${{ steps.ota-cap.outputs.can_ota }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Free disk space (1/3)
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a

    - name: Free disk space (2/3)
      uses: jlumbroso/free-disk-space@main

    - name: Free disk space (3/3)
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install required packages
      run: |
        source scripts/utils/install_packages.sh
        deps_install

    - name: Install Android build-tools
      run: bash scripts/ci/toolchain.sh

    - name: Setup directories
      run: bash scripts/ci/workspace.sh

    - name: Set build environment
      env:
        LUMIROM_VERSION: ${{ vars.LUMIROM_VERSION }}
        STOCK_DEVICE: ${{ matrix.device }}
        TARGET_DEVICE: ${{ inputs.target_device }}
        TARGET_CSC: ${{ inputs.target_csc }}
        TARGET_IMEI: ${{ inputs.target_imei }}
        USE_MODS: ${{ inputs.use_mods }}
        USE_GALAXY_AI: ${{ inputs.use_galaxy_ai }}
        USE_UI_8_TETHERING_APEX: ${{ inputs.use_ui_8_tethering_apex }}
        ZIP_IMG: ${{ inputs.zip_img }}
        DESTINATION: ${{ inputs.destination }}
        LUMIROM_MAINTAINER: ${{ github.actor }}
      run: bash scripts/ci/env.sh

    - name: Validate inputs
      run: |
        source scripts/utils/validation.sh
        validate_inputs

    - name: Detect official OTA capabilities
      id: ota-cap
      env:
        OTA_PK8: ${{ secrets.OTA_PK8 }}
        OTA_CERT: ${{ secrets.OTA_CERT }}
        UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
        TEST_BUILD: ${{ inputs.test_build }}
      run: bash scripts/ci/ota_capability.sh

    - name: Check repo
      env:
        PLATFORM_CERT: ${{ secrets.PLATFORM_CERT }}
      run: |
        source scripts/features/LumiROM.sh
        rom_is_official

    - name: Fetch base firmware
      env:
        # The bucket is public and owned by the project: no HF_USER needed, so
        # forks get the fast path too. The token is only used when present.
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: bash scripts/ci/steps.sh firmware-base

    - name: Download vendor for ${{ matrix.device }}
      run: bash scripts/ci/steps.sh firmware-vendor

    - name: Preparing partitions
      run: bash scripts/ci/steps.sh firmware-partitions

    - name: Apply vendor patches
      run: bash scripts/ci/steps.sh features-vendor

    - name: Apply stock config
      run: bash scripts/ci/steps.sh features-stock

    - name: Debloat ROM
      run: bash scripts/ci/steps.sh features-debloat

    - name: Apply prop features
      run: bash scripts/ci/steps.sh features-props

    - name: Adding mods
      run: bash scripts/ci/steps.sh features-mods

    - name: Patching hotspot
      env:
        PLATFORM_PK8: ${{ secrets.PLATFORM_PK8 }}
        PLATFORM_CERT: ${{ secrets.PLATFORM_CERT }}
      run: bash scripts/ci/steps.sh features-hotspot

    - name: Adding LumiFota OTA Updater
      env:
        BUILD_STATUS: ${{ env.BUILD_STATUS }}
        PLATFORM_PK8: ${{ secrets.PLATFORM_PK8 }}
        PLATFORM_CERT: ${{ secrets.PLATFORM_CERT }}
      run: bash scripts/ci/steps.sh features-fota

    - name: Configuring Galaxy AI
      run: bash scripts/ci/steps.sh features-ai

    - name: Update Build ID
      run: bash scripts/ci/steps.sh features-display

    - name: Install stock framework-res
      run: bash scripts/ci/steps.sh features-framework-res

    - name: Decompile framework jars
      run: bash scripts/ci/steps.sh framework-decompile

    - name: Patch Knox
      env:
        BUILD_STATUS: ${{ env.BUILD_STATUS }}
        PLATFORM_CERT: ${{ secrets.PLATFORM_CERT }}
      run: bash scripts/ci/steps.sh features-knox

    - name: Recompile framework
      env:
        PLATFORM_PK8: ${{ secrets.PLATFORM_PK8 }}
        PLATFORM_CERT: ${{ secrets.PLATFORM_CERT }}
      run: bash scripts/ci/steps.sh framework-recompile

    - name: Build ROM
      env:
        OTA_PK8: ${{ secrets.OTA_PK8 }}
        OTA_CERT: ${{ secrets.OTA_CERT }}
      run: bash scripts/ci/steps.sh rom-build

    - name: Update updater-script
      if: ${{ !inputs.zip_img }}
      run: bash scripts/ci/steps.sh rom-updater-script

    - name: Inject SamsungCamera cleanup (full OTA)
      if: ${{ !inputs.zip_img }}
      run: bash scripts/ci/steps.sh rom-inject-cleanup

    - name: Prepare flashable zip
      if: ${{ !inputs.zip_img }}
      run: bash scripts/ci/steps.sh rom-flashable

    - name: Sign OTA package
      if: ${{ !inputs.zip_img }}
      env:
        OTA_PK8: ${{ secrets.OTA_PK8 }}
        OTA_CERT: ${{ secrets.OTA_CERT }}
        OTA_SIGN_REQUIRED: ${{ steps.ota-cap.outputs.can_ota }}
      run: bash scripts/ci/steps.sh rom-sign

    - name: Prepare IMG zip
      if: ${{ inputs.zip_img }}
      run: bash scripts/ci/steps.sh rom-img-zip

    - name: Save target files
      if: ${{ !inputs.zip_img && inputs.target_files && steps.ota-cap.outputs.can_ota == 'true' }}
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_USER: ${{ vars.HF_USER }}
      run: bash scripts/ci/steps.sh rom-target-files

    - name: Download previous target files
      if: ${{ inputs.incremental_from != '' && steps.ota-cap.outputs.can_ota == 'true' }}
      env:
        HF_USER: ${{ vars.HF_USER }}
        INCREMENTAL_FROM: ${{ inputs.incremental_from }}
      run: bash scripts/ci/steps.sh ota-fetch-source

    - name: Build incremental OTA
      if: ${{ inputs.incremental_from != '' && env.INCREMENTAL_SOURCE_AVAILABLE != 'false' && steps.ota-cap.outputs.can_ota == 'true' }}
      run: bash scripts/ci/steps.sh ota-build

    - name: Inject SamsungCamera cleanup (incremental OTA)
      if: ${{ inputs.incremental_from != '' && env.INCREMENTAL_SOURCE_AVAILABLE != 'false' && steps.ota-cap.outputs.can_ota == 'true' }}
      run: bash scripts/ci/steps.sh ota-inject-cleanup

    - name: Sign incremental OTA
      if: ${{ inputs.incremental_from != '' && env.INCREMENTAL_SOURCE_AVAILABLE != 'false' && steps.ota-cap.outputs.can_ota == 'true' }}
      env:
        OTA_PK8: ${{ secrets.OTA_PK8 }}
        OTA_CERT: ${{ secrets.OTA_CERT }}
        OTA_SIGN_REQUIRED: ${{ steps.ota-cap.outputs.can_ota }}
      run: bash scripts/ci/steps.sh ota-sign

    - name: Upload ROM to ${{ inputs.destination }}
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_USER: ${{ vars.HF_USER }}
        HF_XET_HIGH_PERFORMANCE: "1"
      run: bash scripts/package/upload.sh "$DESTINATION"

    - name: Generate OTA manifests
      if: ${{ !inputs.zip_img && steps.ota-cap.outputs.can_ota == 'true' }}
      env:
        OTA_CHANGELOG: ${{ inputs.ota_changelog }}
      run: bash scripts/ci/manifests.sh generate

    - name: Upload OTA manifests
      if: ${{ !inputs.zip_img && steps.ota-cap.outputs.can_ota == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ota-manifests-${{ matrix.device }}
        path: OTA_MANIFESTS/
        retention-days: 1


  release:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !inputs.zip_img && needs.build.outputs.can_ota == 'true' }}

    steps:
    - name: Download OTA manifests
      uses: actions/download-artifact@v8
      with:
        pattern: ota-manifests-*
        path: OTA_MANIFESTS/
        merge-multiple: true

    - name: Update OTA manifests in LumiROM/updater
      env:
        UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
      run: bash scripts/ci/manifests.sh publish
